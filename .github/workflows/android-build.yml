name: Android — build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Also build a signed release APK (requires signing secrets)'
        type: boolean
        default: true

permissions:
  contents: write

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '17'

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME=$(node -p "require('./package.json').version")
          fi
          CODE=$(( $(git rev-list --count HEAD) ))
          echo "name=$NAME"  >> "$GITHUB_OUTPUT"
          echo "code=$CODE"  >> "$GITHUB_OUTPUT"
          echo "Building Segawa TradeAI v$NAME (versionCode $CODE)"

      - name: Install dependencies
        run: npm ci

      - name: Tests before packaging
        run: npm test

      - name: Build web bundle for the native shell
        env:
          VITE_BASE_PATH: /
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: Decode release keystore (optional)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/segawa-release.keystore"
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — only a debug APK will be produced."
          fi

      - name: Build debug APK
        working-directory: android
        env:
          SEGAWA_VERSION_NAME: ${{ steps.version.outputs.name }}
          SEGAWA_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK (signed)
        if: steps.keystore.outputs.available == 'true'
        working-directory: android
        env:
          SEGAWA_VERSION_NAME: ${{ steps.version.outputs.name }}
          SEGAWA_VERSION_CODE: ${{ steps.version.outputs.code }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/segawa-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Build release APK (unsigned fallback)
        if: steps.keystore.outputs.available != 'true' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
        working-directory: android
        env:
          SEGAWA_VERSION_NAME: ${{ steps.version.outputs.name }}
          SEGAWA_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Collect artifacts
        id: collect
        run: |
          mkdir -p artifacts
          VERSION="${{ steps.version.outputs.name }}"
          DEBUG_APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$DEBUG_APK" ]; then echo "::error::Debug APK was not produced"; exit 1; fi
          cp "$DEBUG_APK" "artifacts/Segawa-TradeAI-v${VERSION}-debug.apk"
          RELEASE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -1 || true)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "artifacts/Segawa-TradeAI-v${VERSION}.apk"
          fi
          {
            echo "### Segawa TradeAI Android build"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Version | v${VERSION} (code ${{ steps.version.outputs.code }}) |"
            echo "| Debug APK | \`Segawa-TradeAI-v${VERSION}-debug.apk\` |"
            if [ -n "$RELEASE_APK" ]; then
              if [ "${{ steps.keystore.outputs.available }}" = "true" ]; then
                echo "| Release APK | \`Segawa-TradeAI-v${VERSION}.apk\` (**signed**) |"
              else
                echo "| Release APK | \`Segawa-TradeAI-v${VERSION}.apk\` (**unsigned**) |"
              fi
            else
              echo "| Release APK | not built |"
            fi
            echo "| Package id | com.segawa.tradeai |"
            echo "| Commit | ${GITHUB_SHA} |"
          } >> "$GITHUB_STEP_SUMMARY"
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: Segawa-TradeAI-APK
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: |
            android/app/build/outputs/logs/**
            android/**/build/reports/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Segawa TradeAI ${{ github.ref_name }}

            - **Package id:** `com.segawa.tradeai`
            - **Version:** `${{ steps.version.outputs.name }}` (code `${{ steps.version.outputs.code }}`)
            - **Debug APK:** `Segawa-TradeAI-v${{ steps.version.outputs.name }}-debug.apk`
            - **Release APK:** ${{ steps.keystore.outputs.available == 'true' && 'signed with the CI keystore' || 'unsigned — configure signing secrets to produce a signed build' }}

            Install by enabling "Install unknown apps" for your browser/file manager, then opening the APK.
            The APK is built from commit `${{ github.sha }}`.
